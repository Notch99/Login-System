# Fichier de langue française pour le système de connexion

# Messages d'inscription
register.success=✅ Inscription réussie!
register.already=⚠️ Vous êtes déjà inscrit!
register.password.mismatch=❌ Les mots de passe ne correspondent pas!
register.title=Inscription terminée
register.subtitle=Bienvenue sur le serveur!

# Messages de connexion
login.success=✅ Connexion réussie!
login.incorrect=❌ Mot de passe incorrect!
login.notRegistered=⚠️ Vous n'êtes pas inscrit! Utilisez /register d'abord.
login.already=⚠️ Vous êtes déjà connecté!
login.title=Connexion réussie
login.subtitle=Bon retour!
login.prompt=Veuillez vous connecter ou vous inscrire
login.promptSubtitle=/register <mot_de_passe> <confirmer> ou /login <mot_de_passe>

# Messages de délai d'attente
timeout.kick=⏰ Vous avez été expulsé pour ne pas vous être connecté!
timeout.warning=⏰ Temps restant: %s secondes
timeout.bossbar=Délai de connexion

# Changement de mot de passe
password.changed=✅ Mot de passe changé avec succès!
password.oldIncorrect=❌ L'ancien mot de passe est incorrect.
password.mustLogin=⚠️ Vous devez être connecté pour changer votre mot de passe.

# Messages de restriction
restrict.chat=❌ Vous devez être connecté pour discuter! Utilisez /register ou /login
restrict.command=❌ Vous devez être connecté pour utiliser les commandes!
restrict.move=❌ Vous devez être connecté pour vous déplacer!
restrict.break=❌ Vous devez être connecté pour casser des blocs!
restrict.place=❌ Vous devez être connecté pour placer des blocs!
restrict.attack=❌ Vous devez être connecté pour attaquer!
restrict.drop=⚠️ Vous devez être connecté pour jeter des objets. Votre objet a été retourné.

# Commande de langue
language.changed=✅ Langue changée en: %s
language.available=Langues disponibles: en, ar, fr, de, zh
language.usage=Usage: /language <en|ar|fr|de|zh>

